<svg width="320" height="376" viewBox="0 0 320 376" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cardClip3">
      <path d="M20 48 a28 28 0 0 1 28 -28 h224 a28 28 0 0 1 28 28 v244 h-280 z" />
    </clipPath>
  </defs>

  <!-- calendar card: rounded top corners, flat bottom -->
  <path d="M20 48 a28 28 0 0 1 28 -28 h224 a28 28 0 0 1 28 28 v244 h-280 z"
        fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>

  <g clip-path="url(#cardClip3)">
    <!-- header bar -->
    <rect x="20" y="20" width="280" height="64" fill="#0d378d"/>

    <!-- nav chevrons -->
    <path d="M52 44 L44 52 L52 60" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M268 44 L276 52 L268 60" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- month label (placeholder word) -->
    <text x="160" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Month</text>

    <!-- weekday row -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#a8a29e" text-anchor="middle">
      <text x="58" y="106">S</text>
      <text x="94" y="106">M</text>
      <text x="130" y="106">T</text>
      <text x="166" y="106">W</text>
      <text x="202" y="106">T</text>
      <text x="238" y="106">F</text>
      <text x="274" y="106">S</text>
    </g>

    <!-- date grid -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#44403c" text-anchor="middle">
      <text x="274" y="134">1</text>
      <text x="58" y="164">2</text>
      <text x="94" y="164">3</text>
      <text x="130" y="164">4</text>
      <text x="166" y="164">5</text>
      <text x="202" y="164">6</text>
      <text x="238" y="164">7</text>
      <text x="274" y="164">8</text>
      <text x="58" y="194">9</text>
      <text x="94" y="194">10</text>
      <text x="130" y="194">11</text>
      <text x="166" y="194">12</text>
      <text x="202" y="194">13</text>
      <text x="238" y="194">14</text>
      <text x="274" y="194">15</text>
      <text x="58" y="224">16</text>
      <text x="94" y="224">17</text>
      <text x="130" y="224">18</text>
      <text x="166" y="224">19</text>
      <text x="202" y="224">20</text>
      <text x="238" y="224">21</text>
      <text x="274" y="224">22</text>
      <text x="58" y="254">23</text>
      <text x="94" y="254">24</text>
      <text x="130" y="254">25</text>
      <text x="166" y="254">26</text>
      <text x="202" y="254">27</text>
    </g>

    <!-- highlighted "available" dates -->
    <circle cx="238" cy="249" r="15" fill="#0d378d" opacity="0.9"/>
    <circle cx="274" cy="249" r="15" fill="#0d378d"/>
    <text x="238" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff">28</text>
    <text x="274" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">29</text>
    <circle cx="274" cy="249" r="15" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- bottom section: vertical mirror of the top section, same 64px height,
       same 20px side/bottom padding and 28px rounded bottom corners, no text/symbols -->
  <path d="M20 292 h280 v36 a28 28 0 0 1 -28 28 h-224 a28 28 0 0 1 -28 -28 z"
        fill="#0d378d"/>
</svg>
